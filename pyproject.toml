[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellml"
version = "1.0.0"
description = "End-to-end ML forecasting & decision support untuk proyek pengeboran sumur minyak (Volve)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "lightgbm>=4.0",
  "optuna>=3.4", "shap>=0.44", "joblib", "pyyaml", "openpyxl", "pyarrow", "matplotlib",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn", "httpx"]
dashboard = ["streamlit>=1.30", "plotly>=5"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
